# Generated from ~/.config/hypr/themes/ascent.toml
# Edit hypr/templates/hyprlock.conf.in, then run `theme-switch apply`.

general {
    hide_cursor = true
    ignore_empty_input = false
    fail_timeout = 2000
}

auth {
    pam {
        enabled = true
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/dtechit/Pictures/Wallpapers/hyprland-0.png
    color = rgba(1a1b26ff)
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(df6124ff) rgba(c2a46dff) 45deg
    inner_color = rgba(24283be6)
    font_color = rgba(c0caf5ff)
    check_color = rgba(9ece6aff)
    fail_color = rgba(df6124ff)
    capslock_color = rgba(c2a46dff)
    numlock_color = rgba(c2a46dff)
    bothlock_color = rgba(df6124ff)

    fade_on_empty = false
    rounding = 8
    placeholder_text = <span foreground="##8b9388">Enter password…</span>
    fail_text = <i>$PAMFAIL</i>

    position = 0, -56
    halign = center
    valign = center
}

# Big clock
label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 86
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Date line
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(df6124ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 42
    halign = center
    valign = center
}

# User + host
label {
    monitor =
    text = cmd[update:3600000] echo "$USER@$(hostname)"
    color = rgba(a9b1d6ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
}

# Small unlock hint
label {
    monitor =
    text = <span foreground="##8b9388">enter to unlock  ·  esc to clear</span>
    color = rgba(8b9388ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -128
    halign = center
    valign = center
}
