# ~/.config/kitty/kitty.conf
# Colours live in theme.conf and are generated by ~/.config/hypr/scripts/theme-switch.
# -----------------------------------------------------------------------------

#: Fonts
font_family          JetBrainsMono Nerd Font
bold_font            auto
italic_font          auto
bold_italic_font     auto
font_size            11.5
disable_ligatures    never
adjust_line_height   105%

#: Cursor
cursor_shape              beam
cursor_beam_thickness     1.5
cursor_blink_interval     0.5
cursor_stop_blinking_after 2

#: Window
remember_window_size   yes
initial_window_width   1100
initial_window_height  650
window_padding_width   10
background_opacity     0.95
background_blur        32
confirm_os_window_close 0
window_resize_step_cells 2
window_resize_step_lines 2

#: Scrollback
scrollback_lines 10000

#: Mouse
mouse_hide_wait 3.0
focus_follows_mouse no

#: Tabs
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  "{index}: {title}"

#: Bell
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab no

#: Clipboard
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

#: Keybinds (kitty defaults already cover most of these; kept explicit for dotfiles)
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
map ctrl+shift+t        new_tab_with_cwd
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+left     previous_tab
map ctrl+shift+right    next_tab
map ctrl+shift+q        close_window
map ctrl+shift+equal    increase_font_size
map ctrl+shift+minus    decrease_font_size
map ctrl+shift+backspace reset_font_size

#: Theme colours — keep this include last so it can override everything above.
include theme.conf
