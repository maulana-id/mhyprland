# Raw audio data for the Waybar music visualizer.
# Generated by cava-waybar on startup — edit cava-state.json instead.

[general]
bars = 10
framerate = 24
autosens = 1
sensitivity = 100
lower_cutoff_freq = 20
higher_cutoff_freq = 20000

[input]
method = pulse
source = @DEFAULT_MONITOR@

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 0.77
