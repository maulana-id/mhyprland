# Raw audio data for the Waybar music visualizer.
# cava feeds 12 bars at 30 FPS to waybar/scripts/cava-waybar.

[general]
bars = 12
framerate = 24
autosens = 1
sensitivity = 100
lower_cutoff_freq = 40
higher_cutoff_freq = 16000

[input]
method = pulse
source = @DEFAULT_MONITOR@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 0.77
